# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/appstore/webserver.pid;
error_log /var/log/sdkwork/appstore/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name appstore-dev.sdkwork.com appstore-dev.birdcoder.com appstore-dev.dtupay.com appstore-dev.sdkwork.cn appstore-dev.birdcoder.cn appstore-dev.dtupay.cn appstore-dev.skubc.com appstore-dev.skubc.cn appstore-dev.zowalk.com appstore-dev.zowalk.cn appstore-dev.offer86.com appstore-dev.offer86.cn appstore-dev.86offer.com appstore-dev.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
