# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/appstore/webserver.pid;
error_log /var/log/sdkwork/appstore/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 0.0.0.0:18090;
    }
    server {
        listen 80;
        server_name appstore-demo.sdkwork.com appstore-demo.birdcoder.com appstore-demo.dtupay.com appstore-demo.noaper.com appstore-demo.sdkwork.cn appstore-demo.birdcoder.cn appstore-demo.dtupay.cn appstore-demo.noaper.cn appstore-demo.skubc.com appstore-demo.skubc.cn appstore-demo.zowalk.com appstore-demo.zowalk.cn appstore-demo.offer86.com appstore-demo.offer86.cn appstore-demo.86offer.com appstore-demo.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
