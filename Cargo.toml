  "crates/sdkwork-appstore-analytics-worker",
  "crates/sdkwork-appstore-publisher-service",
  "crates/sdkwork-appstore-listing-service",
  "crates/sdkwork-appstore-release-service",
  "crates/sdkwork-appstore-catalog-service",
  "crates/sdkwork-appstore-library-service",
  "crates/sdkwork-appstore-moderation-service",
  "crates/sdkwork-appstore-compliance-service",
  "crates/sdkwork-appstore-market-service",
  "crates/sdkwork-appstore-user-store-service",
  "crates/sdkwork-routes-appstore-catalog-app-api",
  "crates/sdkwork-routes-listing-app-api",
  "crates/sdkwork-routes-release-app-api",
  "crates/sdkwork-routes-library-app-api",
  "crates/sdkwork-routes-publisher-app-api",
  "crates/sdkwork-routes-compliance-app-api",
  "crates/sdkwork-routes-moderation-backend-api",
  "crates/sdkwork-routes-appstore-catalog-backend-api",
  "crates/sdkwork-routes-listing-backend-api",
  "crates/sdkwork-routes-publisher-backend-api",
  "crates/sdkwork-routes-market-backend-api",
  "crates/sdkwork-routes-metrics-backend-api",
  "crates/sdkwork-routes-release-open-api",
  "crates/sdkwork-routes-appstore-catalog-open-api",
  "crates/sdkwork-routes-listing-open-api",
  "crates/sdkwork-routes-automation-open-api",
  "crates/sdkwork-routes-user-store-app-api",
  "crates/sdkwork-routes-user-store-open-api"
]
resolver = "2"


[workspace.package]
edition = "2021"
rust-version = "1.85"
[workspace.lints.rust]
# RUST_CODE_SPEC.md section 13 baseline.
# Deny-tier lints (unsafe_code, panic, unwrap_used, expect_used, pedantic) are
# promoted per crate together with their cleanup: enabling them fleet-wide
# today floods or fails builds that have not paid that debt yet.
unsafe_op_in_unsafe_fn = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
exit = "warn"

