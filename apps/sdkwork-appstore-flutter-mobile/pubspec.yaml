name: appstore-flutter-mobile
description: SDKWork App Store Flutter mobile client for discovering, installing, publishing, and operating marketplace applications and AI capabilities.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
