    path: packages/sdkwork_appstore_flutter_mobile_discover
  sdkwork_appstore_flutter_mobile_apps:
    path: packages/sdkwork_appstore_flutter_mobile_apps
  sdkwork_appstore_flutter_mobile_games:
    path: packages/sdkwork_appstore_flutter_mobile_games
  sdkwork_appstore_flutter_mobile_charts:
    path: packages/sdkwork_appstore_flutter_mobile_charts
  sdkwork_appstore_flutter_mobile_category:
    path: packages/sdkwork_appstore_flutter_mobile_category
  sdkwork_appstore_flutter_mobile_collection:
    path: packages/sdkwork_appstore_flutter_mobile_collection
