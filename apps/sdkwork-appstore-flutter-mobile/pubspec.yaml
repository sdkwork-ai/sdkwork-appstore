    sdk: flutter
  sdkwork_appstore_flutter_mobile_core:
    path: packages/sdkwork_appstore_flutter_mobile_core
  sdkwork_appstore_flutter_mobile_commons:
    path: packages/sdkwork_appstore_flutter_mobile_commons
  sdkwork_appstore_flutter_mobile_shell:
    path: packages/sdkwork_appstore_flutter_mobile_shell
  sdkwork_appstore_flutter_mobile_host:
    path: packages/sdkwork_appstore_flutter_mobile_host
