[package]
name = "sdkwork-api-appstore-assembly"
edition = "2021"
version = "0.1.0"
description = "Generated API assembly for sdkwork-appstore application HTTP plane."

[lib]
name = "sdkwork_api_appstore_assembly"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
sdkwork-web-bootstrap.workspace = true
sdkwork-web-core.workspace = true
sdkwork-appstore-database-host.workspace = true
sdkwork-appstore-repository-sqlx.workspace = true
sdkwork-appstore-catalog-service.workspace = true
sdkwork-appstore-listing-service.workspace = true
sdkwork-appstore-release-service.workspace = true
sdkwork-appstore-publisher-service.workspace = true
sdkwork-appstore-library-service.workspace = true
sdkwork-appstore-moderation-service.workspace = true
sdkwork-appstore-compliance-service.workspace = true
sdkwork-appstore-market-service.workspace = true
sdkwork-appstore-service-host.workspace = true
sdkwork-appstore-routes-common.workspace = true
sdkwork-database-config.workspace = true
sdkwork-database-sqlx.workspace = true
sdkwork-iam-web-adapter.workspace = true
sdkwork-web-axum.workspace = true
sdkwork-utils-rust.workspace = true
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "chrono"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
sdkwork-routes-appstore-catalog-app-api.workspace = true
sdkwork-routes-appstore-catalog-backend-api.workspace = true
sdkwork-routes-appstore-catalog-open-api.workspace = true
sdkwork-routes-automation-open-api.workspace = true
sdkwork-appstore-user-store-service.workspace = true
sdkwork-routes-user-store-app-api.workspace = true
sdkwork-routes-user-store-open-api.workspace = true
sdkwork-routes-compliance-app-api.workspace = true
sdkwork-routes-library-app-api.workspace = true
sdkwork-routes-listing-app-api.workspace = true
sdkwork-routes-listing-backend-api.workspace = true
sdkwork-routes-listing-open-api.workspace = true
sdkwork-routes-market-backend-api.workspace = true
sdkwork-routes-metrics-backend-api.workspace = true
sdkwork-routes-moderation-backend-api.workspace = true
sdkwork-routes-publisher-app-api.workspace = true
sdkwork-routes-publisher-backend-api.workspace = true
sdkwork-routes-release-app-api.workspace = true
sdkwork-routes-release-open-api.workspace = true
