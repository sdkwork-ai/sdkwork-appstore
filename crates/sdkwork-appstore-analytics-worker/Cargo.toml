[package]
rust-version.workspace = true
name = "sdkwork-appstore-analytics-worker"
version = "0.1.0"
edition = "2021"
description = "SDKWork App Store analytics projection worker (metrics, charts, trending)."


[lints]
workspace = true
[lib]
path = "src/lib.rs"

[[bin]]
name = "sdkwork-appstore-analytics-worker"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
sdkwork-appstore-database-host.workspace = true
sdkwork-appstore-repository-sqlx.workspace = true
sdkwork-database-sqlx = { workspace = true }

[dev-dependencies]
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono"] }
tokio = { version = "1", features = ["full", "test-util"] }
